<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einkaufsliste Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-2xl p-8">
      <h1 class="text-3xl font-bold mb-2 text-center text-gray-800">🛒 Einkaufsliste</h1>
      <p class="text-center text-gray-600 mb-8">Erste Einrichtung</p>

      <form id="setupForm" class="space-y-6">
        <!-- Admin User Section -->
        <div class="border-b pb-6">
          <h2 class="text-lg font-semibold text-gray-700 mb-4">Admin Account</h2>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Benutzername</label>
            <input 
              type="text" 
              id="adminUsername" 
              name="adminUsername"
              required 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="z.B. admin"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Passwort (min. 8 Zeichen)</label>
            <input 
              type="password" 
              id="adminPassword" 
              name="adminPassword"
              required 
              minlength="8"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="••••••••"
            >
          </div>
        </div>

        <!-- Home Assistant Section -->
        <div>
          <h2 class="text-lg font-semibold text-gray-700 mb-4">🏠 Home Assistant</h2>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Home Assistant URL</label>
            <input 
              type="url" 
              id="haUrl" 
              name="haUrl"
              required 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="https://homeassistant.local:8123"
            >
            <p class="text-xs text-gray-500 mt-1">Z.B.: https://192.168.1.100:8123</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Langlebiger Zugriffstoken</label>
            <textarea 
              id="haToken" 
              name="haToken"
              required 
              rows="4"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent font-mono text-sm"
              placeholder="eyJ0eXAiOiJKV1QiLCJhbGc..."
            ></textarea>
            <p class="text-xs text-gray-500 mt-1">
              Token in Home Assistant: Profil → Sicherheit → Langlebige Zugriffstoken
            </p>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 pt-6">
          <button 
            type="button" 
            id="testBtn"
            class="flex-1 px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium"
          >
            🧪 Verbindung testen
          </button>
          <button 
            type="submit" 
            id="submitBtn"
            class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium"
          >
            Complete Setup
          </button>
        </div>

        <div id="message" class="hidden p-4 rounded-lg text-sm"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const testBtn = document.getElementById('testBtn');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');

    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = `p-4 rounded-lg text-sm ${
        type === 'success' ? 'bg-green-100 text-green-700' :
        type === 'error' ? 'bg-red-100 text-red-700' :
        'bg-blue-100 text-blue-700'
      }`;
    }

    testBtn.addEventListener('click', async () => {
      try {
        testBtn.disabled = true;
        testBtn.textContent = '⏳ Teste...';
        
        const haUrl = document.getElementById('haUrl').value.trim();
        const haToken = document.getElementById('haToken').value.trim();

        if (!haUrl || !haToken) {
          showMessage('Bitte beide Felder ausfüllen', 'error');
          return;
        }

        const response = await fetch(`${haUrl}/api/states`, {
          headers: { 'Authorization': `Bearer ${haToken}` }
        });

        if (response.ok) {
          showMessage('Connection to Home Assistant successful!', 'success');
        } else {
          showMessage('Connection failed. Check URL and token.', 'error');
        }
      } catch (error) {
        showMessage(`❌ Fehler: ${error.message}`, 'error');
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = '🧪 Verbindung testen';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Setup lädt...';

        const data = {
          adminUsername: document.getElementById('adminUsername').value.trim(),
          adminPassword: document.getElementById('adminPassword').value,
          haUrl: document.getElementById('haUrl').value.trim(),
          haToken: document.getElementById('haToken').value.trim()
        };

        const response = await fetch('/api/setup/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          showMessage(`Error: ${result.error}`, 'error');
          return;
        }

        // Save token and redirect
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        
        showMessage('Setup completed! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 1500);
      } catch (error) {
        showMessage(`❌ Fehler: ${error.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Setup completed';
      }
    });
  </script>
</body>
</html>
