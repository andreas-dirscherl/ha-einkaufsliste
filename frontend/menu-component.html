<!-- Centralized Header Menu Component - Used in both index.html and admin.html -->
<header class="header">
  <div class="header-content">
    <h1 class="header-title" id="headerTitle"></h1>
    <div class="header-actions">
      <div class="header-menu-container">
        <button class="header-menu-btn" id="headerMenuBtn" onclick="window.toggleHeaderMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="header-menu-dropdown" id="headerMenuDropdown">
          <a href="/" class="header-menu-item" style="text-decoration: none;" id="menuLinkHome">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Einkaufsliste</span>
          </a>

          <a href="/admin.html" class="header-menu-item" style="text-decoration: none;" id="menuLinkAdmin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"></path></svg>
            <span>Admin-Bereich</span>
          </a>

          <div class="header-menu-separator"></div>

          <!-- Design Theme Selection - Icon Only Toggle -->
          <div style="display: flex; flex-direction: column; gap: var(--spacing-sm); padding: var(--spacing-sm) 0;">
            <span style="font-size: 0.875rem; color: var(--text-secondary); padding: 0 var(--spacing-md);">Design</span>
            <div style="display: flex; gap: 2px; background: transparent; padding: 0; border-radius: var(--radius-md); margin: 0 var(--spacing-md);">
              <button id="themeBtnLight" class="theme-btn-icon active" data-theme="light" title="Helles Theme" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s ease;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 22px; height: 22px;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
              </button>
              <button id="themeBtnDark" class="theme-btn-icon" data-theme="dark" title="Dunkles Theme" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s ease;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 22px; height: 22px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
              </button>
              <button id="themeBtnSystem" class="theme-btn-icon" data-theme="system" title="System Theme" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s ease;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 22px; height: 22px;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              </button>
            </div>
          </div>

          <div class="header-menu-separator"></div>

          <div style="display: flex; flex-direction: column; gap: var(--spacing-xs);">
            <!-- User Display Section -->
            <div style="padding: 0 var(--spacing-md) var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-md);">
              <div id="userAvatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; overflow: hidden;">
                <span id="userInitial">—</span>
              </div>
              <div style="flex: 1; min-width: 0;">
                <div id="userDisplayLabel" style="font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">—</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">Benutzer</div>
              </div>
            </div>
            
            <button class="header-menu-item" onclick="window.openProfileModal()" style="width: 100%; color: var(--text-primary); border-bottom: 1px solid var(--color-gray-200); padding-bottom: var(--spacing-sm); margin-bottom: var(--spacing-sm); margin-left: 0; margin-right: 0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>Profil bearbeiten</span>
            </button>
            <button class="header-menu-item" onclick="window.logoutUser()" style="width: 100%; color: var(--color-error); margin-left: 0; margin-right: 0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span>Abmelden</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
