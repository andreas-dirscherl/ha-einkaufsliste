<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Einkaufsliste">
  <meta name="theme-color" content="#667eea">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/icon-192.svg">
  <link rel="apple-touch-icon" href="/assets/icon-192.svg">
  
  <title>🛒 Einkaufsliste</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background: #f8f9fa;
      overflow-y: auto;
      -webkit-user-select: none;
      user-select: none;
    }
    
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .lists-container {
      flex: 1;
      overflow-y: auto;
    }

    .input-area {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    /* Smooth animations */
    .item-enter {
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .item-exit {
      animation: slideOut 0.2s ease-out;
    }

    @keyframes slideOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 0;
        transform: translateX(100%);
      }
    }

    /* Checked item styling */
    .item-completed {
      opacity: 0.6;
    }

    .item-completed .item-text {
      text-decoration: line-through;
      color: #999;
    }

    /* Offline indicator */
    .offline-badge {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: calc(480px - 40px);
      margin: 0 auto;
    }

    /* Safe area padding for notches */
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }

    .safe-bottom {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    /* Zone auto-select notification */
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }

    .animate-pulse {
      animation: slideIn 0.3s ease-out, slideOut 4.7s ease-in 4s;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 safe-top">
      <div class="px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">🛒 Einkaufsliste</h1>
        <button id="menuBtn" class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg" title="Menü">
          ⚙️
        </button>
      </div>

      <!-- List selector -->
      <div class="px-4 pb-3">
        <select id="listSelector" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500">
          <option value="">Wähle eine Liste...</option>
        </select>
      </div>
    </header>

    <!-- Main content -->
    <div class="lists-container">
      <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center p-8">
        <div class="text-6xl mb-4">📝</div>
        <p class="text-gray-500">Wähle eine Liste aus Home Assistant</p>
      </div>

      <div id="listContent" class="hidden">
        <div id="itemsList" class="divide-y"></div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area bg-white border-t border-gray-200 sticky bottom-0">
      <div class="px-4 py-3 flex gap-2">
        <input 
          type="text" 
          id="itemInput" 
          placeholder="Neuen Artikel hinzufügen..."
          class="flex-1 px-4 py-2 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white"
          autocomplete="off"
        >
        <button 
          id="addBtn" 
          class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium transition"
        >
          +
        </button>
      </div>

      <!-- Offline indicator -->
      <div id="offlineBadge" class="hidden mx-4 mb-3 p-2 bg-yellow-100 text-yellow-800 text-xs rounded-lg text-center">
        📡 Offline - Änderungen werden später synchronisiert
      </div>
    </div>
  </div>

  <!-- Menu Modal -->
  <div id="menuModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end">
    <div class="w-full bg-white rounded-t-2xl p-6 pb-8">
      <h2 class="text-lg font-bold mb-4">Menü</h2>
      
      <div id="adminSection" class="mb-4 hidden pb-4 border-b border-gray-200">
        <a href="/admin.html" class="w-full px-4 py-3 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 font-medium block text-center">
          ⚙️ Admin Dashboard
        </a>
      </div>

      <button id="logoutBtn" class="w-full px-4 py-3 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 font-medium">
        🚪 Abmelden
      </button>
    </div>
  </div>

  <script type="module">
    import WebSocketClient from './websocket-client.js';
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }

    // App State
    let currentList = null;
    let isOnline = navigator.onLine;
    let token = localStorage.getItem('token');
    let wsClient = null; // WebSocket client for real-time sync

    const app = {
      $: (id) => document.getElementById(id),
      $all: (sel) => document.querySelectorAll(sel),
      addClass: (el, cls) => el.classList.add(cls),
      removeClass: (el, cls) => el.classList.remove(cls),
      hasClass: (el, cls) => el.classList.contains(cls),
    };

    // Check if authenticated
    if (!token) {
      window.location.href = '/setup.html';
    }

    // Get user info
    const userStr = localStorage.getItem('user');
    const user = userStr ? JSON.parse(userStr) : null;
    
    // Show admin section if user is admin
    if (user?.isAdmin) {
      document.getElementById('adminSection').classList.remove('hidden');
    }

    // Initialize WebSocket for real-time sync
    async function initWebSocket() {
      if (wsClient) return;
      wsClient = new WebSocketClient(token, user?.id);
      
      try {
        await wsClient.connect();

        // Listen for item changes
        wsClient.on('item-change', handleWebSocketItemChange);
        wsClient.on('disconnected', () => {
          console.log('WebSocket disconnected, app still works offline');
        });
      } catch (error) {
        console.warn('WebSocket connection failed, using polling mode:', error);
        // App still works, just without real-time sync
      }
    }

    // Handle incoming WebSocket item changes
    function handleWebSocketItemChange(changeData) {
      // Only process if we're viewing the affected list
      if (changeData.listId !== currentList) return;

      // Don't process our own changes (avoid duplicate)
      if (changeData.userId === user?.id) return;

      // Update UI based on action
      switch (changeData.type) {
        case 'item-created':
          addItemToUI(changeData.item);
          break;
        case 'item-updated':
          updateItemInUI(changeData.item);
          break;
        case 'item-deleted':
          removeItemFromUI(changeData.itemId);
          break;
      }

      console.log(`🔄 Real-time update from user ${changeData.userId}:`, changeData.type);
    }

    // API calls
    async function apiCall(method, url, body = null) {
      const options = {
        method,
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      };
      
      if (body) options.body = JSON.stringify(body);

      try {
        const response = await fetch(url, options);
        if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = '/setup.html';
          return null;
        }
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        return null;
      }
    }

    // Load lists
    async function loadLists() {
      const data = await apiCall('GET', '/api/lists');
      if (!data) return;

      const selector = app.$('listSelector');
      selector.innerHTML = '<option value="">Wähle eine Liste...</option>';
      
      data.forEach(list => {
        const option = document.createElement('option');
        option.value = list.id;
        option.textContent = list.name;
        selector.appendChild(option);
      });
    }

    // Auto-load recommended list based on current zone
    async function autoSelectRecommendedList() {
      try {
        const result = await apiCall('GET', '/api/user/recommended-list');
        
        if (result.error) {
          console.log('ℹ️ No recommended list:', result.error);
          return;
        }

        if (result.recommendedList) {
          console.log(`📍 Auto-selecting list: ${result.recommendedList.name} (zone: ${result.zone})`);
          
          // Auto-select the list
          const selector = app.$('listSelector');
          selector.value = result.recommendedList.id;
          
          // Trigger change event
          selector.dispatchEvent(new Event('change'));

          // Show info notification (optional)
          const infoEl = document.createElement('div');
          infoEl.className = 'fixed top-4 right-4 p-4 bg-blue-100 text-blue-700 rounded-lg shadow-lg max-w-xs z-50 animate-pulse';
          infoEl.innerHTML = `📍 <strong>${result.recommendedList.name}</strong> ist in Ihrer Nähe (${result.zone})`;
          document.body.appendChild(infoEl);

          // Auto-remove after 5 seconds
          setTimeout(() => infoEl.remove(), 5000);
        } else {
          console.log(`ℹ️ No list for current zone: ${result.reason}`);
        }
      } catch (error) {
        console.warn('Failed to auto-select list:', error);
        // App still works, just no auto-selection
      }
    }

    // Load list items
    async function loadList(listId) {
      currentList = listId;
      
      // Subscribe to list for real-time updates
      if (wsClient && wsClient.isConnected()) {
        wsClient.subscribeToList(listId);
      }

      const data = await apiCall('GET', `/api/lists/${listId}`);
      if (!data) return;

      // Update header with list icon/color
      const header = app.$('app').querySelector('header');
      if (data.icon) {
        header.style.borderTopColor = data.color || '#667eea';
        header.style.borderTopWidth = '4px';
      }

      const itemsList = app.$('itemsList');
      itemsList.innerHTML = '';

      (data.items || []).sort((a, b) => {
        if (a.is_completed !== b.is_completed) return a.is_completed - b.is_completed;
        return new Date(b.created_at) - new Date(a.created_at);
      }).forEach(item => {
        const itemEl = createItemElement(item);
        itemsList.appendChild(itemEl);
      });

      app.$('emptyState').classList.add('hidden');
      app.$('listContent').classList.remove('hidden');
      app.$('itemInput').focus();
    }

    // Add item to UI (for real-time sync)
    function addItemToUI(item) {
      const itemsList = app.$('itemsList');
      const itemEl = createItemElement(item);
      
      // Insert at top (before completed items)
      itemsList.insertBefore(itemEl, itemsList.firstChild);
      
      // Trigger animation
      itemEl.classList.add('item-enter');
    }

    // Update item in UI (for real-time sync)
    function updateItemInUI(item) {
      const itemEl = document.querySelector(`[data-item-id="${item.id}"]`);
      if (itemEl) {
        const checkbox = itemEl.querySelector('input[type="checkbox"]');
        checkbox.checked = item.is_completed;
        
        if (item.is_completed) {
          itemEl.classList.add('item-completed');
        } else {
          itemEl.classList.remove('item-completed');
        }
      }
    }

    // Remove item from UI (for real-time sync)
    function removeItemFromUI(itemId) {
      const itemEl = document.querySelector(`[data-item-id="${itemId}"]`);
      if (itemEl) {
        itemEl.classList.add('item-exit');
        setTimeout(() => itemEl.remove(), 200);
      }
    }

    // Create item element
    function createItemElement(item) {
      const div = document.createElement('div');
      div.className = `item-enter p-4 hover:bg-gray-50 cursor-pointer transition ${item.is_completed ? 'item-completed' : ''}`;
      div.dataset.itemId = item.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.is_completed;
      checkbox.className = 'mr-3 w-5 h-5 cursor-pointer accent-purple-600';

      const label = document.createElement('label');
      label.className = 'item-text cursor-pointer flex-1 ml-2 select-none';
      label.textContent = item.title;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'text-red-500 hover:text-red-700 text-sm opacity-0 hover:opacity-100 transition ml-2';
      deleteBtn.textContent = '🗑️';
      deleteBtn.type = 'button';

      const container = document.createElement('div');
      container.className = 'flex items-center';
      container.appendChild(checkbox);
      container.appendChild(label);
      container.appendChild(deleteBtn);
      div.appendChild(container);

      // Event listeners
      checkbox.addEventListener('change', () => toggleItem(item.id, checkbox.checked));
      deleteBtn.addEventListener('click', () => deleteItem(item.id, div));

      return div;
    }

    // Add item
    async function addItem() {
      const input = app.$('itemInput');
      const title = input.value.trim();

      if (!title || !currentList) return;

      input.value = '';
      input.focus();

      const result = await apiCall('POST', `/api/lists/${currentList}/items`, { title });
      if (result) {
        const itemEl = createItemElement(result);
        app.$('itemsList').prepend(itemEl);

        // Notify server for WebSocket broadcast
        if (wsClient && wsClient.isConnected()) {
          wsClient.syncItemChange(currentList, 'create', result.id, result);
        }
      }
    }

    // Toggle item
    async function toggleItem(itemId, isCompleted) {
      await apiCall('PATCH', `/api/items/${itemId}`, { isCompleted });

      // Notify server for WebSocket broadcast
      if (wsClient && wsClient.isConnected()) {
        wsClient.syncItemChange(currentList, 'update', itemId);
      }
    }

    // Delete item
    async function deleteItem(itemId, element) {
      element.classList.add('item-exit');
      setTimeout(async () => {
        await apiCall('DELETE', `/api/items/${itemId}`);
        element.remove();

        // Notify server for WebSocket broadcast
        if (wsClient && wsClient.isConnected()) {
          wsClient.syncItemChange(currentList, 'delete', itemId);
        }
      }, 200);
    }

    // Event listeners
    app.$('listSelector').addEventListener('change', (e) => {
      if (e.target.value) {
        loadList(e.target.value);
      }
    });

    app.$('addBtn').addEventListener('click', addItem);
    app.$('itemInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addItem();
    });

    app.$('menuBtn').addEventListener('click', () => {
      app.$('menuModal').classList.remove('hidden');
    });

    app.$('menuModal').addEventListener('click', (e) => {
      if (e.target === app.$('menuModal')) {
        app.$('menuModal').classList.add('hidden');
      }
    });

    app.$('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/setup.html';
    });

    // Online/offline detection
    window.addEventListener('online', () => {
      isOnline = true;
      app.$('offlineBadge').classList.add('hidden');
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      app.$('offlineBadge').classList.remove('hidden');
    });

    // Initialize
    initWebSocket(); // Start WebSocket connection
    loadLists();
    autoSelectRecommendedList(); // Auto-select list based on current zone
  </script>
</body>
</html>
